name: Terraform and OpenTofu test

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tftest.hcl"
      - "tests/**"
      - "modules/**"
      - "scripts/**"
      - "TESTING.md"
      - ".github/workflows/terraform-test.yaml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tftest.hcl"
      - "tests/**"
      - "modules/**"
      - "scripts/**"
      - "TESTING.md"
      - ".github/workflows/terraform-test.yaml"
  workflow_dispatch:

jobs:
  test:
    uses: miljodir/workflow-templates/.github/workflows/terraform-test.yaml@terraform-test/v0
    with:
      engine: both
      terraform-version: "1.x"
      opentofu-version: "1.13.9"
      working-directory: "."
      test-directory: "tests"
